[project]
name = "master-ai-agent-builder"
version = "0.5.1"
description = "BisCode: local coding and reviewed n8n/Python agent generation"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.38,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "langgraph>=1.0,<2",
  "langchain-core>=1,<2",
  "telethon>=1.42,<2",
  "cryptography>=46,<48",
  "jsonschema>=4.25,<5",
]

[project.scripts]
master-local = "master_agent.__main__:main"
biscode = "master_agent.__main__:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/master_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: opt-in tests against the installed Ollama model"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
