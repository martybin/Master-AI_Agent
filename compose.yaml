# Linux local development: host networking reaches native Ollama on loopback.
# Both n8n and the optional builder listen on 127.0.0.1 only.
services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.48.5}
    restart: unless-stopped
    network_mode: host
    environment:
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENGINE_DEFAULT_TYPE: v1
      GENERIC_TIMEZONE: ${WORKFLOW_TIMEZONE:-Asia/Tehran}
      TZ: ${WORKFLOW_TIMEZONE:-Asia/Tehran}
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
  builder:
    profiles: [app]
    build: .
    network_mode: host
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/master-agent.sqlite3
    volumes:
      - builder_data:/app/data
    security_opt:
      - no-new-privileges:true
volumes:
  n8n_data:
  builder_data:
